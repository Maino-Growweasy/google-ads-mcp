kind: Deployment
apiVersion: apps/v1
metadata:
  namespace: backend
  name: google-ads-mcp
  labels:
    app: google-ads-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: google-ads-mcp
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0    
  template:
    metadata:
      labels:
        app: google-ads-mcp
    spec:
      containers:
        - name: google-ads-mcp
          image: 494899930155.dkr.ecr.ap-south-1.amazonaws.com/google-ads-mcp:latest
          envFrom:
            - configMapRef:
                name: google-ads-mcp-configmap
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "1"
              memory: "1Gi" 
            limits:
              memory: "3Gi"
      
    
     